name: Web

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
    tags: ['v*']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/webstats-web

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      # Downloadable image for every build (also PRs / forks): docker load < webstats-web.tar
      - name: Build image tarball (amd64)
        uses: docker/build-push-action@v7
        with:
          context: web
          platforms: linux/amd64
          tags: webstats-web:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/webstats-web.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compress image
        run: gzip -f "${{ runner.temp }}/webstats-web.tar"

      - name: Upload image artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: webstats-web-image-${{ github.sha }}
          path: ${{ runner.temp }}/webstats-web.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Build and push multi-arch image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
