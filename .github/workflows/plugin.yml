name: Plugin

on:
  push:
    branches: [main]
    paths: ['plugin/**', '.github/workflows/plugin.yml']
    tags: ['v*']
  pull_request:
    paths: ['plugin/**', '.github/workflows/plugin.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          VERSION="1.0.0-SNAPSHOT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          chmod +x gradlew
          ./gradlew build -Pversion="$VERSION"
          cd build/libs && sha256sum WebStats-*.jar > SHA256SUMS.txt

      # Every build (push, PR, tag, manual) publishes its jar, even if a later step fails.
      - name: Upload plugin jar
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: WebStats-plugin-${{ github.sha }}
          path: |
            plugin/build/libs/WebStats-*.jar
            plugin/build/libs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: plugin/build/reports
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WebStats-plugin-${{ github.sha }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            WebStats-*.jar
            SHA256SUMS.txt
          generate_release_notes: true
